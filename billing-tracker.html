
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Billing Tracker">
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Billing Tracker&quot;,&quot;short_name&quot;:&quot;Billing&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;start_url&quot;:&quot;.&quot;,&quot;background_color&quot;:&quot;%23f5f4f0&quot;,&quot;theme_color&quot;:&quot;%231a6b4a&quot;}">
<title>Billing Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap');
:root{
  --bg:#f5f4f0;--sf:#fff;--sf2:#f0efe9;--bd:#e2e0d8;--bd2:#ccc9bf;
  --tx:#1a1916;--t2:#6b6860;--t3:#a09d96;
  --gn:#1a6b4a;--gnbg:#e6f4ed;
  --am:#7a5500;--ambg:#fef3d8;
  --rd:#8b1e1e;--rdbg:#fdeaea;
  --bl:#1a4a7a;--blbg:#e6eef8;
  --gy:#4a4842;--gybg:#ebebeb;
  --in:#9b8ea0;--inbg:#f0ebf4;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{overflow-x:hidden;}
body{font-family:Outfit,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden;max-width:100%;}
/* Layout */
.sb{width:220px;background:var(--sf);border-right:1px solid var(--bd);padding:1.5rem 0;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:20;}
.sb-logo{padding:0 1.25rem 1.25rem;border-bottom:1px solid var(--bd);margin-bottom:1rem;}
.sb-title{font-size:15px;font-weight:600;letter-spacing:-.02em;}
.sb-sub{font-size:11px;color:var(--t3);margin-top:2px;font-family:Space Grotesk,sans-serif;}
.nav-desk{flex:1;padding:0 .75rem;}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);cursor:pointer;color:var(--t2);font-size:13px;font-weight:400;transition:all .12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:Outfit,sans-serif;}
.ni:hover{background:var(--sf2);color:var(--tx);}
.ni.on{background:var(--tx);color:#fff;font-weight:500;}
.ni svg{width:16px;height:16px;flex-shrink:0;}
.sb-ft{padding:1rem 1.25rem 0;border-top:1px solid var(--bd);}
.sb-ft .pl{font-size:11px;color:var(--t3);margin-bottom:5px;}
.mbadge{display:inline-block;background:var(--gnbg);color:var(--gn);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;font-family:Space Grotesk,sans-serif;}
/* Bottom nav */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);z-index:20;}
.bnav-row{display:grid;grid-template-columns:repeat(5,1fr);}
.bni{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;cursor:pointer;border:none;background:none;color:var(--t3);font-family:Outfit,sans-serif;touch-action:manipulation;}
.bni svg{width:22px;height:22px;}
.bni span{font-size:10px;font-weight:500;}
.bni.on{color:var(--gn);}
/* Main */
.main{margin-left:220px;padding:1rem 1.5rem .75rem;max-width:100%;overflow-x:hidden;}
.monthly-sticky-top{position:sticky;top:0;background:var(--bg);z-index:15;padding-bottom:.3rem;margin-bottom:.15rem;}
/* dvh (not vh) so the box accounts for the mobile address bar showing/hiding —
   with vh the box overflows below the fold when the bar is visible. */
/* max-height, not height: the box shrinks to fit its rows and only scrolls
   once they exceed the space. A fixed height left a large empty gap when
   there were fewer rows than the calculated size. --availh is measured at
   runtime because 100vh is unreliable inside an iframe (it reports the
   parent window, not the frame). */
.mgwrap-scroll{max-height:var(--availh,calc(100vh - 162px));min-height:200px;}
/* Action buttons sit directly under the table box, freeing the header row. */
.mgactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:.45rem;}
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;}
.monthly-sticky-top .ph{margin-bottom:.35rem;}
.monthly-sticky-top .pt{font-size:18px;}
.monthly-sticky-top .ps{font-size:12px;}
.pt{font-size:22px;font-weight:600;letter-spacing:-.03em;}
.ps{font-size:13px;color:var(--t2);margin-top:2px;}
.pa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
/* Metrics */
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem;}
.met{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:.9rem 1.1rem;}
.ml{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:500;}
.mv{font-size:24px;font-weight:600;letter-spacing:-.03em;font-family:Space Grotesk,sans-serif;}
.mv.gn{color:var(--gn);} .mv.am{color:var(--am);} .mv.rd{color:var(--rd);}
.ms{font-size:11px;color:var(--t3);margin-top:3px;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--sf);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;font-family:Outfit,sans-serif;transition:all .12s;white-space:nowrap;touch-action:manipulation;}
.btn:hover,.btn:active{background:var(--sf2);}
.btn.pri{background:var(--tx);color:#fff;border-color:var(--tx);}
.btn.pri:hover,.btn.pri:active{background:#333;}
.btn.grn{background:var(--gn);color:#fff;border-color:var(--gn);}
.btn.grn:hover,.btn.grn:active{background:#145a3d;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn.dng{color:var(--rd);border-color:#e8b4b4;}
.btn.dng:hover{background:var(--rdbg);}
.btn svg{width:14px;height:14px;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.st{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--t3);}
/* Client list */
.clist{display:flex;flex-direction:column;gap:4px;}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:11px 14px;display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:10px;cursor:pointer;transition:border-color .12s;touch-action:manipulation;}
.cc:hover,.cc:active{border-color:var(--bd2);}
.cc.inact{opacity:.5;}
.ddb{font-size:11px;font-weight:700;color:var(--t3);font-family:Space Grotesk,sans-serif;text-align:center;background:var(--sf2);border-radius:4px;padding:2px 4px;}
.cn{font-size:13px;font-weight:500;}
.cs{font-size:11px;color:var(--t3);margin-top:2px;}
.cf{font-size:14px;font-weight:600;font-family:Space Grotesk,sans-serif;text-align:right;}
/* Badges */
.bdg{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;}
/* Compact badges in the monthly grid so client rows are shorter. */
.mgtable .bdg{font-size:9px;padding:1px 5px;}
.bgc{background:var(--gnbg);color:var(--gn);}
.bbt{background:var(--ambg);color:var(--am);}
.bcc{background:var(--blbg);color:var(--bl);}
.bch{background:var(--gybg);color:var(--gy);}
.bca{background:#fff3e0;color:#7a4400;}
.bot{background:var(--inbg);color:var(--in);}
.bin{background:var(--gybg);color:var(--gy);}
.brec{background:var(--gnbg);color:var(--gn);}
.bman{background:var(--ambg);color:var(--am);}
.fbdg{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--sf2);color:var(--t2);}
/* Dots */
.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;font-weight:700;font-family:Space Grotesk,sans-serif;transition:transform .1s;touch-action:manipulation;}
.dot:hover{transform:scale(1.15);}
.dot.pd{background:var(--gnbg);color:var(--gn);border:1px solid #b3ddc8;}
.dot.ov{background:var(--rdbg);color:var(--rd);border:1px solid #f0b0b0;}
.dot.im{background:var(--inbg);color:var(--in);border:1px solid #d8cedf;}
.dot.ft{background:var(--sf2);color:var(--bd2);border:1px dashed var(--bd);cursor:default;}
.dot.nd{background:var(--sf2);color:var(--t3);border:1px dashed var(--bd2);cursor:pointer;}
.dot.nd:hover{background:#fff3e0;border-color:var(--am);color:var(--am);transform:scale(1.15);}
.dot.up{background:var(--sf2);color:var(--t3);border:1px solid var(--bd2);cursor:pointer;}
.dot.up:hover{background:#fff3e0;border-color:var(--am);color:var(--am);transform:scale(1.15);}
.dot.ft:hover{transform:none;}
.dot.mn{background:var(--ibg);color:var(--in);border:1px dashed #d8cedf;cursor:pointer;}
/* Monthly grid - TABLE based for reliable rendering */
.mgwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:var(--rl);width:100%;max-width:100%;}
.mgtable{border-collapse:collapse;background:var(--sf);}
.mgtable th{background:var(--sf2);padding:6px 3px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);font-size:9px;font-weight:700;text-transform:uppercase;color:var(--t3);text-align:center;white-space:nowrap;position:sticky;top:0;z-index:6;}
.mgtable th.cur{background:#eef6f2;color:var(--tx);}
.mgtable th.namecol{text-align:left;padding:6px 8px;min-width:130px;max-width:130px;position:sticky;left:0;top:0;z-index:8;background:var(--sf2);}
.mgtable td{padding:3px 2px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:center;vertical-align:middle;min-width:70px;}
.mgtable .cname{font-size:11px;font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mgtable td.namecol{text-align:left;padding:4px 8px;position:sticky;left:0;background:var(--sf);z-index:5;min-width:130px;max-width:130px;overflow:hidden;box-shadow:2px 0 4px rgba(0,0,0,.06);line-height:1.25;}
.mgtable tr:last-child td{border-bottom:none;}
/* Totals rows pinned to bottom of the scroll box. Two rows: Invoiced (last, 0px) then Paid sits directly above it, so Paid is offset by the Invoiced row height. */
.mgtable tfoot td{border-top:2px solid var(--bd2);position:sticky;z-index:6;background:#f0efe9;}
/* Paid row (upper) and Invoiced row (lower) get distinct opaque fills. */
.mgtable tfoot tr:nth-last-child(2) td{background:#eceae2;}
.mgtable tfoot tr:last-child td{background:#f4faf6;}
.mgtable tfoot td.namecol{background:#e6e4db;}
.mgtable tfoot tr:last-child td.namecol{background:#eaf5ee;}
.mgtable tfoot tr:nth-last-child(2) td{bottom:var(--footh,28px);}
.mgtable tfoot tr:last-child td{bottom:0;}
.mgtable tfoot td.namecol{z-index:7;}
/* Detail */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
.di label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);font-weight:600;display:block;margin-bottom:3px;}
.di span{font-size:13px;font-weight:500;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:1.1rem;margin-bottom:1rem;}
.ct{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:.9rem;text-transform:uppercase;letter-spacing:.05em;}
.hr{display:grid;grid-template-columns:72px 1fr auto auto;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd);}
.hr:last-child{border-bottom:none;}
.hm{font-size:12px;font-weight:600;color:var(--t2);font-family:Space Grotesk,sans-serif;}
.hs{font-size:12px;color:var(--t3);}
.ha{font-size:13px;font-weight:600;font-family:Space Grotesk,sans-serif;}
.sd{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
.sbtn{padding:4px 8px;font-size:11px;border-radius:6px;border:1px solid var(--bd);background:var(--sf2);color:var(--t2);cursor:pointer;font-family:Outfit,sans-serif;font-weight:500;touch-action:manipulation;text-align:center;width:100%;}
.sbtn.on{border-color:var(--bd2);background:var(--tx);color:#fff;}
/* Overdue cards */
.oc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
.on2{font-size:14px;font-weight:600;}
.om{font-size:12px;color:var(--t3);margin-top:2px;}
.oa{font-size:17px;font-weight:700;font-family:Space Grotesk,sans-serif;color:var(--rd);}
/* One row per outstanding month inside an overdue card. */
.omlist{margin-top:10px;padding-top:8px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:5px;}
.omrow{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;}
.omlbl{font-size:12px;font-weight:600;color:var(--t2);font-family:Space Grotesk,sans-serif;}
.omamt{font-size:13px;font-weight:700;color:var(--rd);font-family:Space Grotesk,sans-serif;}
.omrow .btn{font-size:11px;padding:3px 8px;}
.oact{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center;flex-shrink:0;}
/* Dot dropdown */
/* A .dd lives inside a <td>. The sticky header (z6), name column (z5) and
   totals rows (z6) paint above that cell, so an open menu looked transparent /
   overlapped. Raise the cell itself (and its .mdm) above all sticky chrome
   while its menu is open, so the dropdown escapes cleanly. */
.mdm{position:relative;display:inline-block;}
.mdm:has(.dd.open){z-index:100;}
td:has(.dd.open){position:relative;z-index:100;}
.dd{z-index:101;}
.dd.up{top:auto;bottom:110%;}
/* .dd is min-width:160px but a month column is only ~70px, so the menu
   overhangs to the LEFT and gets clipped by the scroll box / sticky name
   column on left-hand columns. .dd.rt flips the overhang to the right. */
.dd.rt{right:auto;left:0;}
.dd{position:absolute;top:110%;right:0;background:#fff;border:1px solid var(--bd2);border-radius:var(--r);padding:4px;z-index:101;min-width:172px;max-width:calc(100vw - 24px);box-shadow:0 6px 20px rgba(0,0,0,.18);display:none;isolation:isolate;}
.dd.open{display:block;}
.ddi{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:13px;cursor:pointer;border-radius:4px;white-space:nowrap;color:var(--tx);touch-action:manipulation;}
.ddi:hover,.ddi:active{background:var(--sf2);}
/* Modal */
.mbg{position:fixed;inset:0;background:rgba(20,18,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:1000;}
.modal{background:var(--sf);border-radius:var(--rl) var(--rl) 0 0;border-top:1px solid var(--bd);padding:1.5rem;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
.mtit{font-size:16px;font-weight:600;margin-bottom:1.1rem;letter-spacing:-.02em;}
.fr{margin-bottom:11px;}
.fr label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:4px;}
.fr input,.fr select,.fr textarea{width:100%;padding:9px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:14px;font-family:Outfit,sans-serif;background:var(--bg);color:var(--tx);outline:none;-webkit-appearance:none;}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-color:#4caf82;}
.fr textarea{min-height:60px;resize:vertical;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.fh{font-size:11px;color:var(--t3);margin-top:3px;}
.fac{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem;padding-top:1rem;border-top:1px solid var(--bd);}
/* Toast */
.toast{position:fixed;bottom:80px;right:1rem;background:var(--tx);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
/* Banners */
.nbox{background:var(--ambg);border:1px solid #e8d090;border-radius:var(--r);padding:9px 11px;font-size:12px;color:var(--am);margin-top:8px;display:flex;gap:7px;align-items:flex-start;}
.ibanner{background:var(--inbg);border:1px solid #d8cedf;border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--in);margin-bottom:.75rem;display:flex;align-items:center;gap:6px;}
.tbanner{background:var(--rdbg);border:1px solid #e8b4b4;border-radius:var(--r);padding:8px 14px;font-size:12px;color:var(--rd);margin-bottom:1rem;display:flex;align-items:flex-start;gap:8px;}
.si{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);cursor:pointer;user-select:none;}
.si input[type=checkbox]{width:auto;}
.bb{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);cursor:pointer;margin-bottom:1rem;background:none;border:none;font-family:Outfit,sans-serif;padding:0;}
.bb:hover{color:var(--tx);}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--t3);font-size:13px;}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:1rem;font-size:12px;color:var(--t2);}
/* Inside the monthly sticky header the legend is a full extra row. Compact
   it so it costs less vertical space without losing the key. */
.monthly-sticky-top .legend{margin-bottom:0;gap:9px;font-size:11px;}
.monthly-sticky-top .legend .dot{width:13px!important;height:13px!important;font-size:8px!important;}
.li{display:flex;align-items:center;gap:5px;}
/* Activity log */
.alog{display:flex;flex-direction:column;gap:0;}
.alog-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);align-items:flex-start;}
.alog-row:last-child{border-bottom:none;}
.alog-ts{font-size:10px;color:var(--t3);font-family:Space Grotesk,sans-serif;min-width:100px;flex-shrink:0;margin-top:2px;}
.alog-txt{font-size:13px;color:var(--tx);flex:1;}
.alog-meta{font-size:11px;color:var(--t3);margin-top:2px;}
.alog-add{display:flex;gap:8px;margin-top:10px;}
.alog-add input{flex:1;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;font-family:Outfit,sans-serif;background:var(--bg);color:var(--tx);outline:none;}
.alog-add input:focus{border-color:#4caf82;}
/* Inline amount edit in monthly */
.amt-edit{font-size:11px;width:70px;min-width:0;padding:4px 6px;border:1px solid var(--gnbg);border-radius:4px;font-family:Space Grotesk,sans-serif;text-align:center;background:var(--sf);color:var(--tx);outline:none;-webkit-appearance:none;}
.amt-edit:focus{border-color:var(--gn);}
/* Chart */
.chart-wrap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:1.1rem;margin-bottom:1.5rem;}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:120px;overflow-x:auto;}
.chart-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:32px;}
.chart-bar{width:28px;border-radius:3px 3px 0 0;transition:height .3s;}
.chart-lbl{font-size:9px;color:var(--t3);font-family:Space Grotesk,sans-serif;white-space:nowrap;}
/* Settings panel */
.settings-list{display:flex;flex-direction:column;gap:6px;}
.set-item{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.set-item-label{font-size:13px;font-weight:500;}
/* Responsive */
@media(max-width:700px){
  .sb{display:none;} .bnav{display:block;} .main{margin-left:0;padding:.6rem;padding-bottom:120px;padding-top:env(safe-area-inset-top,.6rem);}
  .f3{grid-template-columns:1fr 1fr;} .dgrid{grid-template-columns:1fr 1fr;}
  /* Amount was hidden on mobile for space. Restore it — tighten the month
     column and shrink the status text so all four columns fit. */
  .hr{grid-template-columns:52px minmax(0,1fr) auto auto;gap:6px;}
  .hm{font-size:11px;}
  .hs{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ha{font-size:12px;}
  .mets{grid-template-columns:1fr 1fr;} .mv{font-size:20px;}
  .oc{flex-wrap:wrap;} .toast{bottom:72px;}
  .omrow{grid-template-columns:1fr auto auto auto;gap:5px;}
  .omlbl{font-size:11px;} .omamt{font-size:12px;}
  .omrow .btn{font-size:10px;padding:3px 6px;}
  .pt{font-size:18px;}
  /* Phone: compact table box that fits a vertical screen without page scrolling.
     Header/legend/buttons stay above; the box itself scrolls in both directions. */
  /* Reserve only what is actually occupied: bottom nav (~64) + action bar
     (~44) + padding (~22). A full +40% was not possible — the box would
     have run under the nav bar — so the header row was freed instead. */

var SY = 2026;
function gm(y,m){ return (y-SY)*12+m; }
function ymOf(g){ var m=((g%12)+12)%12; var y=SY+Math.floor(g/12); return {y:y,m:m}; }
var CG = gm(TY,TM);

// ── SUPABASE CONFIG ──
var SB_URL = 'https://bzgallwouruesyaymynm.supabase.co';
var SB_KEY = 'sb_publishable_WotOgelJf1YXwfMAA518bQ_o-m7pe7-';
var SB_HEADERS = {'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

function sbGet(key, cb){
  fetch(SB_URL+'/rest/v1/billing_data?key=eq.'+key+'&select=value', {headers:SB_HEADERS})
    .then(function(r){return r.json();})
    .then(function(rows){
      if(rows && rows[0] && rows[0].value) cb(null, rows[0].value);
      else cb(null, null);
    })
    .catch(function(e){ cb(e, null); });
}

function sbSet(key, value, cb){
  // Upsert
  fetch(SB_URL+'/rest/v1/billing_data', {
    method:'POST',
    headers:Object.assign({}, SB_HEADERS, {'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({key:key, value:value, updated_at:new Date().toISOString()})
  })
  .then(function(r){ if(cb) cb(r.ok ? null : new Error('HTTP '+r.status)); })
  .catch(function(e){ if(cb) cb(e); });
}

// ── CONFIGURABLE OPTIONS (editable in Settings) ──
var DEFAULT_OPTS = {
  payTypes: ['GoCardless','Bank Transfer','Credit Card','Cheque','Cash','Standing Order','Direct Debit','PayPal','Other'],
  invTypes: ['Recurring','Manual','Auto','Pro Forma','Credit Note'],
  freqTypes: ['Monthly','Two Monthly','Three Monthly','Six Monthly','Annual','One Off','Weekly','Fortnightly']
};
var OPTS = JSON.parse(localStorage.getItem('bt_opts')||'null') || JSON.parse(JSON.stringify(DEFAULT_OPTS));
var FREQMO = {Monthly:1,'Two Monthly':2,'Three Monthly':3,'Six Monthly':6,Annual:12,'One Off':0,Weekly:0,Fortnightly:0};

function saveOpts(){
  try{ localStorage.setItem('bt_opts',JSON.stringify(OPTS)); }catch(e){}
  sbSet('opts', OPTS);
}

function isBillingMonth(c,g){
  var freq = c.frequency||'Monthly';
  var f = FREQMO[freq];
  if(f===undefined) f=1;
  if(f===0) return false; // One Off / Weekly etc - managed manually
  if(f===1) return true;
  var anchor = c.anchorMonth||0;
  return (g - anchor) % f === 0;
}
function isDueThisMonth(c){ return isBillingMonth(c,CG); }
function isOverdueToday(c){
  if(!c.active) return false;
  var v = c.payments[String(CG)];
  if(v===true||v==='inactive'||v==='notdue') return false;
  // Explicitly marked overdue always shows regardless of date
  if(v==='overdue') return true;
  if(!isDueThisMonth(c)) return false;
  return TD >= (c.date||1);
}

// Every outstanding month for a client, not just the current one.
// Returns [{g, amt}] oldest first.
//
// A month counts as outstanding only when it is a real billing month AND is
// genuinely unpaid. Deliberately NOT counted: blank historical months. Most
// clients only have a handful of months explicitly recorded, so treating every
// gap as a debt would invent months of arrears that were never real. Blank past
// months stay neutral here exactly as they do on the monthly grid.
function outstandingMonths(c){
  if(!c.active) return [];
  var out=[];
  for(var g=CG-14; g<=CG; g++){
    if(!isBillingMonth(c,g)) continue;
    var v=c.payments[String(g)];
    if(v===true||v==='inactive'||v==='notdue') continue; // settled or not billed
    if(v==='overdue'){ out.push({g:g, amt:dispAmt(c,g)}); continue; }
    if(g===CG){
      // Current month: only overdue once the due day has passed
      if(TD >= (c.date||1)) out.push({g:g, amt:dispAmt(c,g)});
      continue;
    }
    // Past month: only if an entry exists and is explicitly unpaid (false).
    // Absent entries are treated as "no record", not as debt.
    if(v===false) out.push({g:g, amt:dispAmt(c,g)});
  }
  return out;
}

function outstandingTotal(c){
  return outstandingMonths(c).reduce(function(s,o){ return s+o.amt; },0);
}

// ── DEFAULT CLIENT DATA ──
var DEF = [

  {id:11,date:24,invoiceDay:10,name:'Oxford Eco Centre',contact:'Claire Crawford',payType:'GoCardless',invType:'Recurring',frequency:'Monthly',mmf:99,notes:'',active:true,anchorMonth:0,payments:{'1':true,'2':true,'3':true,'4':true}},
  {id:12,date:26,invoiceDay:12,name:'Storme',contact:'Storme Webster',payType:'Bank Transfer',invType:'Manual',frequency:'Three Monthly',mmf:125,notes:'Quarterly. Next invoice due 30/06/26',active:true,anchorMonth:2,payments:{'2':true,'5':false}},
  {id:13,date:26,invoiceDay:12,name:'Discount Sewing 2',contact:'Ollie Chapman',payType:'Bank Transfer',invType:'Manual',frequency:'Monthly',mmf:97,notes:'Ad-hoc invoice',active:true,anchorMonth:0,payments:{}},
  {id:14,date:27,invoiceDay:13,name:'DND Ltd',contact:'David Nimmo',payType:'GoCardless',invType:'Recurring',frequency:'Monthly',mmf:299,notes:'',active:true,anchorMonth:0,payments:{'1':true,'2':true,'3':true,'4':true}}
];

// Start with localStorage cache for instant load, then sync from Supabase
var clients = JSON.parse(localStorage.getItem('bt_v4')||'null') || DEF;
function migrateClients(arr){
  arr.forEach(function(c){
    // Ensure activityLog exists but don't auto-populate it
    if(!c.activityLog) c.activityLog=[];
    if(!c.payType) c.payType = (c.payment||'').toLowerCase().indexOf('gocardless')>=0 ? 'GoCardless' : 'Bank Transfer';
    if(!c.invType) c.invType = 'Manual';
    if(!c.frequency) c.frequency = 'Monthly';
    if(c.anchorMonth===undefined) c.anchorMonth = 0;
    if(!c.invoiceDay) c.invoiceDay = c.date;
    if(c.active===undefined) c.active = true;
  });
  return arr;
}
clients = migrateClients(clients);
var nextId = clients.length ? Math.max.apply(null,clients.map(function(c){return c.id;}))+1 : 1;

var SAVE_PENDING = false;
var SAVE_TIMER = null;
function save(){
  // Write to localStorage immediately (instant, offline-safe)
  try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
  // Debounce Supabase writes — batch rapid changes into one write after 800ms
  if(SAVE_TIMER) clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(function(){
    SAVE_PENDING = true;
    updateSyncBadge('saving');
    sbSet('clients', clients, function(err){
      SAVE_PENDING = false;
      if(err){ updateSyncBadge('error'); }
      else { updateSyncBadge('ok'); }
    });
  }, 800);
}

function updateSyncBadge(state){
  var el = document.getElementById('sync-badge');
  if(!el) return;
  if(state==='saving'){ el.textContent='Syncing...'; el.style.color='var(--am)'; }
  else if(state==='ok'){
    var now=new Date();
    el.textContent='Synced '+now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    el.style.color='var(--gn)';
  }
  else if(state==='error'){ el.textContent='Sync error'; el.style.color='var(--rd)'; }
  else if(state==='offline'){ el.textContent='Offline'; el.style.color='var(--t3)'; }
}

// Load fresh data from Supabase on startup (runs after initial render from cache)
function loadFromSupabase(){
  updateSyncBadge('saving');
  sbGet('clients', function(err, val){
    if(err){ updateSyncBadge('offline'); return; }
    if(val && Array.isArray(val) && val.length > 0){
      // Only skip if THIS device has a pending save in flight (locally edited, not yet pushed)
      if(SAVE_PENDING){ updateSyncBadge('ok'); return; }
      // Supabase is the source of truth — always use it, overwrite local cache fully
      clients = migrateClients(val);
      nextId = clients.length ? Math.max.apply(null,clients.map(function(c){return c.id;}))+1 : 1;
      try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
    }
    updateSyncBadge('ok');
    render();
  });
  sbGet('opts', function(err, val){
    if(!err && val){ OPTS = val; try{ localStorage.setItem('bt_opts',JSON.stringify(OPTS)); }catch(e){} }
  });
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}
function gbp(n){ return '\u00a3'+parseFloat(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ord(n){ n=parseInt(n); if(!n)return''; var s=['th','st','nd','rd'],v=n%100; return s[(v-20)%10]||s[v]||s[0]; }
function sortC(list){ return list.slice().sort(function(a,b){return (a.date||1)-(b.date||1);}); }

var PAY_COLORS = {'GoCardless':'bgc','Bank Transfer':'bbt','Credit Card':'bcc','Cheque':'bch','Cash':'bca','Standing Order':'bbt','Direct Debit':'bgc','PayPal':'bcc','Other':'bot'};
function payBadge(c){
  var cls = PAY_COLORS[c.payType] || 'bot';
  return '<span class="bdg '+cls+'">'+esc(c.payType||'?')+'</span>';
}
function invBadge(c){ return c.invType==='Recurring'?'<span class="bdg brec">Recurring</span>':'<span class="bdg bman">'+esc(c.invType||'Manual')+'</span>'; }
function freqBadge(c){ return '<span class="fbdg">'+esc(c.frequency||'Monthly')+'</span>'; }

var DOTST = {pd:'pd',ov:'ov',im:'im',ft:'ft',nd:'nd'};
var DLBL = {pd:'&#10003;',ov:'!',im:'&mdash;',ft:'',nd:''};
var DTIT = {pd:'Paid',ov:'Overdue',im:'Not billed',ft:'Future',nd:'Not due'};
var DCOL = {pd:'var(--gn)',ov:'var(--rd)',im:'var(--in)',ft:'var(--bd)',nd:'var(--bd)'};

function dotState(c,g){
  var v=c.payments[String(g)];
  if(v===true) return 'pd';
  if(v==='inactive') return 'im';
  if(v==='notdue') return 'mn'; // manually set not-due — editable
  if(v==='overdue') return 'ov'; // explicitly marked overdue
  // If a real entry exists for a future month (e.g. via rollover), treat it as
  // editable 'up' rather than locking it as future — only TRUE future with no
  // entry at all stays locked
  // Inactive clients: no stored value means simply "not billed" — show an
  // editable 'im' dot rather than a locked future cell, so it can still be
  // corrected. Rollover deliberately skips inactive clients, so they never
  // get an auto-created entry here.
  if(!c.active) return 'im';
  if(g>CG){
    if(v!==undefined) return 'up'; // rolled-over entry exists — editable
    return 'ft'; // genuinely future, no entry yet — locked
  }
  if(!isBillingMonth(c,g)) return 'nd'; // auto not-due from billing frequency — locked
  if(g===CG && TD < (c.date||1)) return 'up'; // current month, not yet due
  if(g===CG) return 'ov'; // current month past due date
  return 'up'; // past months — neutral until explicitly set
}

var VIEW='dashboard', SELID=null, MODAL=false, EDITC=null, SHOWINACT=false, SHOWINACT_M=true;

    html='<div style="padding:2rem;color:var(--rd)">Error: '+err.message+'</div>';
  }
  main.innerHTML=html;
  if(MODAL){
    try{ main.insertAdjacentHTML('beforeend',vModal()); }catch(e){}
  }
  bindModal();

  if(VIEW==='monthly'){ syncAvailHeight(); syncFootHeight(); setTimeout(scrollToToday,80); }
}

// ── DASHBOARD ──
function vDash(){
  var active=clients.filter(function(c){return c.active;});
  // True monthly-equivalent value: divide each client's fee by their billing
  // frequency in months (e.g. a £600 quarterly fee = £200/month equivalent)
  var mrr=active.reduce(function(s,c){
    var freqMonths=FREQMO[c.frequency]||1;
    if(freqMonths<=0) return s; // one-off/weekly clients excluded from MRR
    return s+(parseFloat(c.mmf||0)/freqMonths);
  },0);
  var pg=String(CG);
  var paidAmt=active.filter(function(c){return c.payments[pg]===true;}).reduce(function(s,c){return s+dispAmt(c,CG);},0);
  // Match the Overdue screen: count every outstanding month, not just this one.
  var od=[];
  sortC(active).forEach(function(c){
    var months=outstandingMonths(c);
    if(months.length) od.push({c:c, months:months, total:outstandingTotal(c)});
  });
  var odAmt=od.reduce(function(s,x){return s+x.total;},0);
  var rows=od.slice(0,6).map(function(x){
    var c=x.c, many=x.months.length>1;
    var oldest=x.months[0], oy=ymOf(oldest.g);
    return '<div class="oc" style="cursor:pointer" onclick="openC('+c.id+')">'
      +'<div style="flex:1"><div class="on2">'+esc(c.name)+'</div>'
      +'<div class="om">'+esc(c.contact)+' &bull; Due '+c.date+ord(c.date)+' &bull; '+payBadge(c)+'</div>'
      +(many?'<div class="om" style="color:var(--rd);font-weight:600">'+x.months.length+' months owing, from '+MN[oy.m]+' '+oy.y+'</div>':'')
      +'</div>'
      +'<div class="oact"><div class="oa">'+gbp(x.total)+'</div>'
      +'<button class="btn grn sm" onclick="event.stopPropagation();setSt('+c.id+','+oldest.g+',\'paid\')">Pay '+MN[oy.m]+'</button></div></div>';
  }).join('');
  // Revenue chart - last 6 months
  var chartCols=[]; for(var ci=CG-5;ci<=CG;ci++) chartCols.push(ci);
  var chartMax=0;
  var chartData=chartCols.map(function(g){
    var ym=ymOf(g);
    var paid=clients.filter(function(c){return c.active;}).reduce(function(s,c){
      return s+(c.payments[String(g)]===true?dispAmt(c,g):0);
    },0);
    if(paid>chartMax) chartMax=paid;
    return {g:g,m:MN[ym.m].slice(0,3),paid:paid,cur:g===CG};
  });
  var chartBars=chartData.map(function(d){
    var pct=chartMax>0?Math.round((d.paid/chartMax)*100):0;
    return '<div class="chart-bar-col">'
      +'<div style="font-size:9px;color:'+(d.cur?'var(--gn)':'var(--t3)')+';font-family:Space Grotesk,sans-serif;text-align:center">'+gbp(d.paid)+'</div>'
      +'<div class="chart-bar" style="height:'+Math.max(4,pct)+'%;background:'+(d.cur?'var(--gn)':'var(--gnbg)')+'"></div>'
      +'<div class="chart-lbl" style="'+(d.cur?'color:var(--gn);font-weight:700':'')+'">'+d.m+'</div>'
      +'</div>';
  }).join('');
  var chart='<div class="chart-wrap"><div class="ct">Revenue collected &mdash; last 6 months</div>'
    +'<div class="chart-bars">'+chartBars+'</div></div>';
  return '<div class="ph">'
    +'<div><div class="pt">Dashboard</div><div class="ps">Today: '+TD+' '+MN[TM]+' '+TY+'</div></div>'
    +'<div class="pa"><button class="btn sm" onclick="exportCSV()">Export CSV</button></div></div>'
    +'<div class="mets">'
    +'<div class="met"><div class="ml">Active clients</div><div class="mv">'+active.length+'</div><div class="ms">'+clients.filter(function(c){return !c.active;}).length+' inactive</div></div>'
    +'<div class="met"><div class="ml">Monthly value</div><div class="mv gn">'+gbp(mrr)+'</div><div class="ms">Equivalent, all frequencies</div></div>'
    +'<div class="met"><div class="ml">Paid this month</div><div class="mv gn">'+gbp(paidAmt)+'</div></div>'
    +'<div class="met"><div class="ml">Overdue now</div><div class="mv '+(od.length?'rd':'')+"'"+'>'+gbp(odAmt)+'</div><div class="ms">'+od.length+' clients</div></div>'
    +'</div>'
    +chart
    +'<div class="sh"><div class="st">Overdue as of '+TD+' '+MN[TM]+'</div>'
    +'<button class="btn sm" onclick="go(\'overdue\')">View all &rarr;</button></div>'
    +(rows||'<div class="empty">No overdue payments today!</div>');
}

    return s+(c.payments[gk]===true?dispAmt(c,parseInt(gk)):0);
  },0);

    +iab

    +'<div><div class="pt">'+esc(c.name)+'</div><div class="ps">'+esc(c.contact)+'</div></div>'
    +'<div style="display:flex;gap:6px">'
    +'<button class="btn sm" onclick="openEdit('+c.id+')">Edit</button>'
    +'<button class="btn sm dng" onclick="delC('+c.id+')">'
    +'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h10M5 4V2h4v2M5 7v4M9 7v4M3 4l.5 8h7L11 4"/></svg></button></div></div>'
    +'<div class="card"><div class="dgrid">'
    +'<div class="di"><label>Fee / charge</label><span style="color:var(--gn);font-family:Space Grotesk,sans-serif">'+gbp(c.mmf)+'</span></div>'
    +'<div class="di"><label>Frequency</label><span>'+freqBadge(c)+'</span></div>'
    +'<div class="di"><label>Payment due day</label><span>'+c.date+ord(c.date)+' of month</span></div>'
    +'<div class="di"><label>Invoice raise day</label><span>'+(c.invoiceDay||'?')+ord(c.invoiceDay||0)+' of month</span></div>'
    +'<div class="di"><label>Payment type</label><span>'+payBadge(c)+'</span></div>'
    +'<div class="di"><label>Invoice type</label><span>'+invBadge(c)+'</span></div>'
    +'<div class="di"><label>Status</label><span>'+(c.active?'<span class="bdg brec">Active</span>':'<span class="bdg bin">Inactive</span>')+'</span></div>'

    +'<div class="di"><label>Email</label><span>'+(c.email?'<a href="mailto:'+esc(c.email)+'" style="color:var(--bl)">'+esc(c.email)+'</a>':'&mdash;')+'</span></div>'
    +'<div class="di"><label>Phone</label><span>'+(c.phone?'<a href="tel:'+esc(c.phone)+'" style="color:var(--bl)">'+esc(c.phone)+'</a>':'&mdash;')+'</span></div>'

// ── MONTHLY VIEW (TABLE-BASED) ──
function vMonthly(){
  var activeClients=sortC(clients.filter(function(c){return c.active;}));
  var inactiveClients=sortC(clients.filter(function(c){return !c.active;}));
  var visible=activeClients;
  var allClients=sortC(clients);
  // Columns: current month leftmost by default; extend forward if any client
  // has a rolled-over entry for a future month, back to Apr 2025
  var maxFutureG = CG;
  allClients.forEach(function(c){
    Object.keys(c.payments).forEach(function(k){
      var gi = parseInt(k);
      if(gi > maxFutureG) maxFutureG = gi;
    });
  });
  var cols=[];
  for(var g=maxFutureG;g>=CG-14;g--) cols.push(g);

  // Next-month label for rollover button — month AFTER the furthest one already rolled in
  var nextG=maxFutureG+1;
  var nextYM=ymOf(nextG);
  var nextLabel=MN[nextYM.m]+' '+nextYM.y;

  // Build table header
  var thead='<tr><th class="namecol">Client</th>';
  var prevY=null;
  for(var ci=0;ci<cols.length;ci++){
    var g=cols[ci];
    var ym=ymOf(g);
    var isCur=(g===CG);
    var yr=(ym.y!==prevY)?'<span style="font-size:8px;display:block;opacity:.7">'+ym.y+'</span>':'';
    prevY=ym.y;
    thead+='<th'+(isCur?' class="cur"':'')+' id="mhd'+g+'" style="min-width:52px">'+yr+MN[ym.m].slice(0,3)+'</th>';
  }
  thead+='</tr>';

  // Pre-compute totals per column
  var colTotals={}, colPaid={};
  for(var ci=0;ci<cols.length;ci++){
    var g=cols[ci], tot=0, paid=0;
    for(var ri=0;ri<visible.length;ri++){
      var c=visible[ri];
      var st=dotState(c,g);
      var ma=dispAmt(c,g);
      if(st!=='nd'&&st!=='ft'){ tot+=parseFloat(ma||0); if(st==='pd') paid+=parseFloat(ma||0); }
    }
    colTotals[g]=tot; colPaid[g]=paid;
  }

  // Build table rows
  var tbody='';
  for(var ri=0;ri<visible.length;ri++){
    var c=visible[ri];
    tbody+='<tr>'
      +'<td class="namecol" style="cursor:pointer" onclick="openC('+c.id+')">'  
      +'<div class="cname">'+esc(c.name)+'</div>'
      +'<div style="font-size:10px;color:var(--t3)">'+esc(c.contact)+'</div>'
      +'<div style="font-size:10px;margin-top:2px">'+payBadge(c)+' '+invBadge(c)+'</div>'
      +'<div style="font-size:10px;color:var(--t3);margin-top:1px">'+freqBadge(c)+' &bull; Due '+c.date+ord(c.date)+'</div>'
      +'</td>';
    for(var ci2=0;ci2<cols.length;ci2++){
      var cg=cols[ci2];
      var st=dotState(c,cg);
      var lbl=DLBL[st]||'';
      var isFut=(st==='ft');  // true future months are always locked
      var isLocked=isFut;  // ONLY future months with no data are locked. Everything else is editable.
      var mid='dd'+c.id+'x'+cg;
      var clickStr=isLocked?'':' onclick="openDot(event,\''+mid+'\')"';
      var lockTitle=DTIT[st]||'Cannot edit';
      var dotEl='<span class="dot '+st+'" title="'+(isLocked?lockTitle:'Click to change')+'"'+clickStr+'>'+lbl+'</span>';
      var amtTxt='';
      if(st!=='ft'&&st!=='nd'){  // only show amount for active billing months
        var cellAmt=dispAmt(c,cg);
        if(cellAmt>0){  // only show if amount > 0
          var amtColor=st==='pd'?'var(--gn)':st==='ov'?'var(--rd)':'var(--t3)';
          amtTxt='<div style="font-size:9px;font-weight:600;font-family:Space Grotesk,sans-serif;color:'+amtColor+';margin-top:2px;line-height:1">'+gbp(cellAmt)+'</div>';
        }
      }
      var menuEl='';
      if(!isLocked){
        var pendingId='pd_'+c.id+'_'+cg;
        menuEl='<div class="dd" id="'+mid+'" onclick="event.stopPropagation()">';
        menuEl+='<div style="padding:4px 6px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px">';
        menuEl+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:5px">Status</div>';
        menuEl+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">';
        menuEl+='<button class="sbtn '+(st==='pd'?'on':'')+' ddst" onclick="setDotSt(event,\''+mid+'\',\'paid\')">&#10003; Paid</button>';
        menuEl+='<button class="sbtn '+(st==='ov'?'on':'')+' ddst" onclick="setDotSt(event,\''+mid+'\',\'overdue\')">! Overdue</button>';
        menuEl+='<button class="sbtn '+(st==='im'?'on':'')+' ddst" onclick="setDotSt(event,\''+mid+'\',\'inactive\')">Not billed</button>';
        menuEl+='<button class="sbtn '+(st==='nd'?'on':'')+' ddst" onclick="setDotSt(event,\''+mid+'\',\'notdue\')">Not due</button>';
        menuEl+='</div></div>';
        menuEl+='<div style="padding:4px 6px 6px">';
        menuEl+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--t3);margin-bottom:5px">Amount &pound;</div>';
        menuEl+='<div style="display:flex;gap:4px;align-items:center">';
        menuEl+='<input class="amt-edit" style="flex:1;width:auto" type="text" inputmode="decimal" placeholder="'+c.mmf+'" id="ae_'+c.id+'_'+cg+'" value="'+dispAmt(c,cg)+'">';
        menuEl+='<button class="btn sm grn" style="padding:3px 8px;font-size:11px;flex-shrink:0" onclick="event.stopPropagation();event.preventDefault();saveMonthBoth('+c.id+','+cg+',\''+mid+'\')">Save</button>';
        menuEl+='</div></div>';
        menuEl+='</div>';
      }
      tbody+='<td><div class="mdm">'+dotEl+menuEl+'</div>'+amtTxt+'</td>';
    }
    tbody+='</tr>';
  }


  if(SHOWINACT_M && inactiveClients.length>0){
    tbody+='<tr><td class="namecol" colspan="'+(cols.length+1)+'" style="padding:6px 12px;background:var(--inbg);font-size:10px;font-weight:700;text-transform:uppercase;color:var(--in);border-top:2px solid #d8cedf">Inactive clients</td></tr>';
    for(var rii=0;rii<inactiveClients.length;rii++){
      var ic=inactiveClients[rii];
      tbody+='<tr style="opacity:.55">';
      tbody+='<td class="namecol" style="cursor:pointer" onclick="openC('+ic.id+')">';
      tbody+='<div class="cname">'+esc(ic.name)+'</div>';
      tbody+='<div style="font-size:10px;color:var(--t3)">'+esc(ic.contact)+'</div>';
      tbody+='<div style="font-size:10px;margin-top:2px">'+payBadge(ic)+' '+invBadge(ic)+'</div>';
      tbody+='<div style="font-size:10px;color:var(--t3);margin-top:1px">'+freqBadge(ic)+' &bull; Due '+ic.date+ord(ic.date)+'</div>';
      tbody+='</td>';
      for(var cii=0;cii<cols.length;cii++){
        var cgx=cols[cii];
        var stx=dotState(ic,cgx);
        var lblx=DLBL[stx]||'';
        var isLockedx=(stx==='ft');  // ONLY future months with no data are locked
        var midx='dd'+ic.id+'x'+cgx;
        var clkx=isLockedx?'':' onclick="openDot(event,\''+midx+'\')"';
        var dotx='<span class="dot '+stx+'" title="'+DTIT[stx]+'"'+clkx+'>'+lblx+'</span>';
        var amtx='';
        if(stx!=='ft'&&stx!=='nd'){var ca=dispAmt(ic,cgx);if(ca>0){var ac=stx==='pd'?'var(--gn)':stx==='ov'?'var(--rd)':'var(--t3)';amtx='<div style="font-size:9px;font-weight:600;color:'+ac+';margin-top:2px">'+gbp(ca)+'</div>';}}
        var menux='';
        if(!isLockedx){
          var saveBtn='<button class="btn sm grn" style="padding:3px 8px;font-size:11px" onclick="event.stopPropagation();event.preventDefault();saveMonthBoth('+ic.id+','+cgx+',\''+midx+'\')">'+'Save</button>';
          menux='<div class="dd" id="'+midx+'" onclick="event.stopPropagation()">';
          menux+='<div style="padding:4px 6px;border-bottom:1px solid var(--bd);margin-bottom:4px">';
          menux+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);margin-bottom:4px">Status</div>';
          menux+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px">';
          menux+='<button class="sbtn '+(stx==='pd'?'on':'')+' ddst" onclick="setDotSt(event,\''+midx+'\',\'paid\')">&#10003; Paid</button>';
          menux+='<button class="sbtn '+(stx==='ov'?'on':'')+' ddst" onclick="setDotSt(event,\''+midx+'\',\'overdue\')">! Overdue</button>';
          menux+='<button class="sbtn '+(stx==='im'?'on':'')+' ddst" onclick="setDotSt(event,\''+midx+'\',\'inactive\')">Not billed</button>';
          menux+='<button class="sbtn '+(stx==='nd'?'on':'')+' ddst" onclick="setDotSt(event,\''+midx+'\',\'notdue\')">Not due</button>';
          menux+='</div></div>';
          menux+='<div style="padding:4px 6px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--t3);margin-bottom:4px">Amount</div>';
          menux+='<div style="display:flex;gap:4px;align-items:center">';
          menux+='<input class="amt-edit" style="flex:1;width:auto" type="text" inputmode="decimal" placeholder="'+ic.mmf+'" id="ae_'+ic.id+'_'+cgx+'" value="'+dispAmt(ic,cgx)+'">';
          menux+=saveBtn;
          menux+='</div></div></div>';
        }
        tbody+='<td><div class="mdm">'+dotx+menux+'</div>'+amtx+'</td>';
      }
      tbody+='</tr>';
    }
  }
  // Totals footer rows
  // Row 1: active clients paid/outstanding
  var tfoot='<tr style="background:var(--sf2)">'    +'<td class="namecol" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gn);border-top:2px solid var(--bd2)">Paid</td>';
  for(var ci=0;ci<cols.length;ci++){
    var g=cols[ci];
    var isCur=(g===CG);
    var tot=colTotals[g]||0;
    var paid=colPaid[g]||0;
    var outstanding=tot-paid;
    tfoot+='<td style="padding:5px 3px;border-right:1px solid var(--bd);border-top:2px solid var(--bd2);'+(isCur?'background:#eef6f2;':'')+'text-align:center">'      +'<div style="font-size:9px;font-weight:700;font-family:Space Grotesk,sans-serif;color:var(--gn);line-height:1.4">'+gbp(paid)+'</div>'      +(outstanding>0?'<div style="font-size:8px;font-family:Space Grotesk,sans-serif;color:var(--rd);line-height:1">&minus;'+gbp(outstanding)+'</div>':'')      +'</td>';
  }
  tfoot+='</tr>';
  // Row 2: invoice total (all active clients expected for that month)
  tfoot+='<tr style="background:#f8fef9">'    +'<td class="namecol" style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bl);border-bottom:1px solid var(--bd)">Invoiced</td>';
  for(var ci2=0;ci2<cols.length;ci2++){
    var cg2=cols[ci2];
    var isCur2=(cg2===CG);
    var invTot=0;
    allClients.forEach(function(c){
      var st2=dotState(c,cg2);
      if(st2!=='nd'&&st2!=='ft') invTot+=dispAmt(c,cg2);
    });
    tfoot+='<td style="padding:5px 3px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);'+(isCur2?'background:#f0fbf5;':'')+'text-align:center">'      +'<div style="font-size:9px;font-weight:700;font-family:Space Grotesk,sans-serif;color:var(--bl);line-height:1.4">'+(invTot>0?gbp(invTot):'')+'</div>'      +'</td>';
  }
  tfoot+='</tr>';

  return '<div class="monthly-sticky-top">'
    +'<div class="ph" style="margin-bottom:.75rem">'
    +'<div><div class="pt">Monthly view</div><div class="ps">Current month left &bull; scroll right for history to Apr 2025</div></div>'
    +'</div>'
    +'<div class="legend" style="margin-bottom:0">'

    +'<div class="mgactions">'
    +'<button class="btn sm '+(SHOWINACT_M?'pri':'')+'" onclick="SHOWINACT_M=!SHOWINACT_M;render()">'+(SHOWINACT_M?'Hide':'Show')+' inactive</button>'
    +'<button class="btn grn sm" onclick="rolloverMonth()">&#43; Rollover to '+nextLabel+'</button>'
    +'<button class="btn sm" onclick="exportCSV()">CSV</button>'
    +'</div>';
}

function scrollToToday(){
  // Current month is the first column - just scroll to start
  var wrap=document.getElementById('mgwrap');
  if(wrap) wrap.scrollLeft=0;
}

function rolloverMonth(){
  // Find the furthest month any client already has data for, roll into the one after that
  var maxG=CG;
  clients.forEach(function(c){
    Object.keys(c.payments).forEach(function(k){
      var gi=parseInt(k);
      if(gi>maxG) maxG=gi;
    });
  });
  var nextG=maxG+1;
  var nextYM=ymOf(nextG);
  var nextLabel=MN[nextYM.m]+' '+nextYM.y;
  // Use an in-app confirmation instead of native confirm() — native dialogs
  // are unreliable inside iframes on mobile (often auto-dismissed or blocked)
  showRolloverConfirm(nextG, nextLabel);
}

function showRolloverConfirm(nextG, nextLabel){
  var html = '<div class="mbg" id="rc-bg">'
    +'<div class="modal" onclick="event.stopPropagation()" style="max-width:360px">'
    +'<div class="mtit">Rollover to '+nextLabel+'</div>'
    +'<div style="font-size:13px;color:var(--t2);margin-bottom:1.25rem;line-height:1.5">This creates a new unpaid entry for every active client who bills in '+nextLabel+'. Existing entries will not be changed.</div>'
    +'<div class="fac">'
    +'<button class="btn" onclick="closeRolloverConfirm()">Cancel</button>'
    +'<button class="btn grn pri" onclick="doRollover('+nextG+',\''+nextLabel+'\')">Create entries</button>'
    +'</div></div></div>';
  document.getElementById('main').insertAdjacentHTML('beforeend', html);
  var bg=document.getElementById('rc-bg');
  if(bg) bg.addEventListener('click', function(e){ if(e.target===bg) closeRolloverConfirm(); });
}

function closeRolloverConfirm(){
  var el=document.getElementById('rc-bg');
  if(el) el.remove();
}

function doRollover(nextG, nextLabel){
  closeRolloverConfirm();
  var active=clients.filter(function(c){return c.active;});
  var count=0;
  active.forEach(function(c){
    if(!isBillingMonth(c,nextG)) return;
    var nextKey=String(nextG);
    if(c.payments[nextKey]!==undefined) return;
    c.payments[nextKey]=false;
    count++;
  });
  if(count===0){
    toast('Nothing to roll over — all entries for '+nextLabel+' already exist');
    return;
  }
  // Flush immediately rather than relying on debounce
  try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
  if(SAVE_TIMER){ clearTimeout(SAVE_TIMER); SAVE_TIMER=null; }
  SAVE_PENDING=true;
  updateSyncBadge('saving');
  sbSet('clients', clients, function(err){
    SAVE_PENDING=false;
    updateSyncBadge(err?'error':'ok');
  });
  toast('Rolled over '+count+' client'+(count===1?'':'s')+' into '+nextLabel);
  render();
}

// ── OVERDUE ──
function vOverdue(){
  // Track every outstanding month, not just the current one. Build a flat list
  // of {client, month, amount} so a client owing 3 months appears with all 3.
  var od=[];
  sortC(clients).forEach(function(c){
    var months=outstandingMonths(c);
    if(months.length) od.push({c:c, months:months, total:outstandingTotal(c)});
  });
  var total=od.reduce(function(s,x){return s+x.total;},0);
  var monthCount=od.reduce(function(s,x){return s+x.months.length;},0);
  var owingIds={};
  od.forEach(function(x){ owingIds[x.c.id]=true; });
  var upcoming=sortC(clients.filter(function(c){
    if(!c.active||!isDueThisMonth(c)) return false;
    if(owingIds[c.id]) return false; // already listed above as outstanding
    var v=c.payments[String(CG)];
    if(v===true||v==='inactive') return false;
    return TD<(c.date||1);
  }));
  var rows=od.map(function(x){
    var c=x.c;
    // One line per outstanding month, each independently payable/skippable.
    var mrows=x.months.map(function(o){
      var ym=ymOf(o.g);
      var isCur=(o.g===CG);
      return '<div class="omrow">'
        +'<div class="omlbl">'+MN[ym.m]+' '+ym.y+(isCur?' <span style="color:var(--am)">(current)</span>':'')+'</div>'
        +'<div class="omamt">'+gbp(o.amt)+'</div>'
        +'<button class="btn grn sm" onclick="event.stopPropagation();setSt('+c.id+','+o.g+',\'paid\')">Paid</button>'
        +'<button class="btn sm" onclick="event.stopPropagation();setSt('+c.id+','+o.g+',\'inactive\')">Skip</button>'
        +'</div>';
    }).join('');
    var many=x.months.length>1;
    return '<div class="oc" style="cursor:pointer;flex-direction:column;align-items:stretch" onclick="openC('+c.id+')">'
      +'<div style="display:flex;align-items:flex-start;gap:8px;width:100%">'
      +'<div style="flex:1"><div class="on2">'+esc(c.name)+'</div>'
      +'<div class="om">'+esc(c.contact)+' &bull; Due '+c.date+ord(c.date)+' &bull; '+payBadge(c)+' &bull; '+freqBadge(c)+'</div>'
      +(c.notes?'<div class="om" style="font-style:italic">'+esc(c.notes)+'</div>':'')
      +'</div>'
      +'<div style="text-align:right;flex-shrink:0">'
      +'<div class="oa">'+gbp(x.total)+'</div>'
      +(many?'<div style="font-size:10px;color:var(--rd);font-weight:600">'+x.months.length+' months owing</div>':'')
      +'</div></div>'
      +'<div class="omlist">'+mrows+'</div>'
      +'</div>';
  }).join('');
  var upRows=upcoming.map(function(c){
    var days=c.date-TD;
    return '<div class="oc" style="opacity:.7">'
      +'<div style="flex:1"><div class="on2" style="color:var(--t2)">'+esc(c.name)+'</div>'
      +'<div class="om">Due '+c.date+ord(c.date)+' &mdash; '+days+' day'+(days===1?'':'s')+' away &bull; '+freqBadge(c)+'</div></div>'
      +'<div class="oa" style="color:var(--am);font-size:14px">'+gbp(dispAmt(c,CG))+'</div></div>';
  }).join('');
  return '<div class="ph">'
    +'<div><div class="pt">Overdue</div><div class="ps">All outstanding months &bull; as at '+TD+' '+MN[TM]+' '+TY+'</div></div>'
    +'<div class="pa"><button class="btn sm" onclick="exportCSV()">CSV</button></div></div>'
    +'<div class="tbanner"><svg style="width:14px;height:14px;flex-shrink:0;margin-top:2px" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="5.5"/><path d="M7 4v3.5L9 8"/></svg>'
    +'<span>Every unpaid month, oldest first &mdash; not just this month. The current month appears once its due date has passed. Months never recorded are not counted as debt.</span></div>'
    +'<div class="mets">'
    +'<div class="met"><div class="ml">Clients owing</div><div class="mv '+(od.length?'rd':'')+'">'+od.length+'</div>'
    +'<div class="ms">'+monthCount+' month'+(monthCount===1?'':'s')+' total</div></div>'
    +'<div class="met"><div class="ml">Total outstanding</div><div class="mv rd">'+gbp(total)+'</div></div>'
    +'<div class="met"><div class="ml">Upcoming</div><div class="mv am">'+upcoming.length+'</div></div>'
    +'</div>'
    +'<div class="sh"><div class="st">Outstanding</div></div>'
    +(rows||'<div class="empty">Nothing outstanding &mdash; all caught up!</div>')
    +(upcoming.length?'<div class="sh" style="margin-top:1.25rem"><div class="st">Upcoming this month</div></div>'+upRows:'');
}

// Stored as c.monthAmounts = {'5': 299.00, '-3': 250.00} keyed by global month index
function getMonthAmt(c, g){
  // Returns override if set, else null (not c.mmf — callers must handle null)
  if(c.monthAmounts && c.monthAmounts[String(g)]!==undefined) return c.monthAmounts[String(g)];
  return null;
}
function dispAmt(c, g){
  // Safe display amount: override if set, else default fee
  var ov = getMonthAmt(c, g);
  return (ov !== null) ? ov : parseFloat(c.mmf||0);
}
// setDotSt defined below (handles both dropdown and history edit modal)

function saveMonthBoth(cid, g, mid){
  // Save both status and amount in one go
  var dd = document.getElementById(mid);
  var inp = document.getElementById('ae_'+cid+'_'+g);
  var c = clients.find(function(x){ return x.id===cid; });
  if(!c) return;

  // Work out which status to save
  var newSt = (dd && dd.dataset.pendingSt) || null;

  // Work out amount
  var raw = (inp && inp.value || '').replace(/[^0-9.]/g,'');
  var val = raw==='' ? null : parseFloat(raw);

  if(newSt){
    // Apply status change
    if(newSt==='paid') c.payments[String(g)]=true;
    else if(newSt==='inactive') c.payments[String(g)]='inactive';
    else if(newSt==='notdue') c.payments[String(g)]='notdue';
    else if(newSt==='overdue') c.payments[String(g)]='overdue';
    else c.payments[String(g)]=false; // generic unpaid
    var ym=ymOf(g);
    addLog(c, 'Status for '+MN[ym.m]+' '+ym.y+' set to '+newSt);
  }

  if(val!==null && !isNaN(val) && val>=0){
    if(!c.monthAmounts) c.monthAmounts={};
    c.monthAmounts[String(g)]=val;
    var ym2=ymOf(g);
    addLog(c,'Amount for '+MN[ym2.m]+' '+ym2.y+' set to '+gbp(val));
  }

  if(!newSt && (val===null || isNaN(val))){
    toast('Select a status or enter an amount'); return;
  }
  // If no status selected, preserve existing status (don't wipe it)
  // newSt being null means 'no change to status' — that's fine, amount-only save

  // Flush immediately to localStorage + Supabase
  try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
  if(SAVE_TIMER){ clearTimeout(SAVE_TIMER); SAVE_TIMER=null; }
  SAVE_PENDING=true;
  updateSyncBadge('saving');
  sbSet('clients', clients, function(err){
    SAVE_PENDING=false;
    updateSyncBadge(err?'error':'ok');
  });
  toast('Saved'); closeDots(); render();
}

function saveMonthAmt(cid, g){
  var inp=document.getElementById('ae_'+cid+'_'+g);
  if(!inp) return;
  var raw=inp.value.replace(/[^0-9.]/g,'');  // strip any £ or spaces
  var val=parseFloat(raw);
  if(isNaN(val)||val<0){ toast('Please enter a valid amount'); return; }
  var c=clients.find(function(x){return x.id===cid;});
  if(!c) return;
  if(!c.monthAmounts) c.monthAmounts={};
  c.monthAmounts[String(g)]=val;
  var ym=ymOf(g);
  addLog(c,'Amount for '+MN[ym.m]+' '+ym.y+' set to '+gbp(val));
  // Flush immediately to both localStorage and Supabase (bypass debounce)
  try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
  if(SAVE_TIMER){ clearTimeout(SAVE_TIMER); SAVE_TIMER=null; }
  SAVE_PENDING=true;
  updateSyncBadge('saving');
  sbSet('clients', clients, function(err){
    SAVE_PENDING=false;
    updateSyncBadge(err?'error':'ok');
  });
  toast('Amount updated'); closeDots(); render();
}

function openDot(e,mid){
  e.stopPropagation();
  e.preventDefault(); // prevent touch -> click double-fire
  closeDots();
  var m=document.getElementById(mid);
  if(!m) return;
  // The table now lives in a fixed-height scroll box, so a dropdown opening
  // downward on a lower row gets clipped by the box edge (making the dot look
  // dead). Flip it upward when there isn't room below.
  m.classList.remove('up');
  m.classList.add('open');
  // Explicitly raise the containing cell above the sticky header/name column/
  // totals rows. CSS :has() does this too, but not every engine honours it —
  // without this the menu paints *under* the sticky chrome and looks transparent.
  var cell=m.closest('td');
  if(cell){ cell.style.position='relative'; cell.style.zIndex='100'; }
  var box=document.getElementById('mgwrap');
  if(box){
    var dotR=m.parentElement.getBoundingClientRect();
    var boxR=box.getBoundingClientRect();
    var need=m.offsetHeight+8;
    var below=boxR.bottom-dotR.bottom;
    var above=dotR.top-boxR.top;
    if(below<need && above>below) m.classList.add('up');

    // Horizontal: the menu is wider than a column, so it overhangs. Default is
    // right:0 (overhang leftwards). If that would collide with the left edge of
    // the box — or slide under the sticky name column — flip it to open rightwards.
    var menuW=m.offsetWidth||160;
    var nameCol=box.querySelector('td.namecol,th.namecol');
    var leftLimit=boxR.left+(nameCol?nameCol.offsetWidth:0);
    var roomLeft=dotR.right-leftLimit;      // space if overhanging left
    var roomRight=boxR.right-dotR.left;     // space if overhanging right
    if(roomLeft<menuW && roomRight>roomLeft) m.classList.add('rt');
  }
}
function syncFootHeight(){
  // The upper totals row must sit exactly on top of the lower one. Measure the
  // lower row rather than assuming a height, which differs between phone/desktop.
  // Deferred to after paint — measuring synchronously during render can read a
  // stale/short height, which leaves the two rows overlapping.
  requestAnimationFrame(function(){
    var rows=document.querySelectorAll('.mgtable tfoot tr');
    if(rows.length<2) return;
    var h=rows[rows.length-1].getBoundingClientRect().height;
    if(h>0) document.documentElement.style.setProperty('--footh', Math.ceil(h)+'px');
  });
}

function syncAvailHeight(){
  // Work out how much vertical space the table box may occupy, by measuring the
  // real viewport and subtracting the chrome above and below it.
  //
  // 100vh cannot be trusted here: the app is embedded in an iframe on the
  // WordPress page, where vh units resolve against the PARENT window rather
  // than the frame. That mismatch is what produced the large blank areas above
  // and below the table.
  requestAnimationFrame(function(){
    var box=document.getElementById('mgwrap');
    if(!box) return;

    // Actual usable height of this document/frame.
    var vh=window.innerHeight||document.documentElement.clientHeight;

    // Everything above the box within the page flow.
    var top=box.getBoundingClientRect().top;

    // Everything below it: action bar, bottom nav, and page padding.
    var below=0;
    var acts=document.querySelector('.mgactions');
    if(acts) below+=acts.offsetHeight;
    var nav=document.querySelector('.bnav');
    if(nav && getComputedStyle(nav).display!=='none') below+=nav.offsetHeight;
    var main=document.getElementById('main');
    if(main) below+=parseFloat(getComputedStyle(main).paddingBottom)||0;
    below+=14; // breathing room

    var avail=Math.floor(vh-top-below);
    if(avail<200) avail=200; // never collapse to nothing
    document.documentElement.style.setProperty('--availh', avail+'px');
  });
}
window.addEventListener('resize', syncAvailHeight);

function syncNavHeight(){
  // The action bar sits directly on top of the bottom nav. Measure the nav
  // rather than hardcoding a height, so they meet exactly on any device.
  var nav=document.querySelector('.bnav');
  if(!nav) return;
  var h=nav.offsetHeight;
  if(h>0) document.documentElement.style.setProperty('--navh', h+'px');
}

function exportCSV(){
  var s=gm(TY,0), en=gm(TY+1,11), cols=[];
  for(var g=s;g<=en;g++) cols.push(g);
  var hdr=['Client','Contact','Due Day','Invoice Day','Fee','Pay Type','Inv Type','Frequency','Active','Notes']
    .concat(cols.map(function(g){var ym=ymOf(g);return MN[ym.m]+' '+ym.y;})).join(',');
  var rows=clients.map(function(c){
    var mc=cols.map(function(g){
      var v=c.payments[String(g)];
      if(v===true) return 'Paid';
      if(v==='inactive') return 'Not billed';
      if(g>CG) return 'Future';
      if(!isBillingMonth(c,g)) return 'Not due';
      return 'Overdue';
    }).join(',');
    return ['"'+(c.name||'').replace(/"/g,'""')+'"','"'+(c.contact||'').replace(/"/g,'""')+'"',
      c.date,c.invoiceDay||'',c.mmf,c.payType||'',c.invType||'',c.frequency||'',
      c.active?'Yes':'No','"'+(c.notes||'').replace(/"/g,'""')+'"',mc].join(',');
  });
  var csv=[hdr].concat(rows).join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='billing-'+TODAY.toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('CSV exported');
}


// ── GOOGLE DRIVE SYNC ──
var DRIVE_FILENAME = 'billing-tracker-data.json';
var driveStatus = ''; // message shown in settings

function getDriveToken(){
  // Try to get token from cookie or meta tag injected by Claude's Drive connector
  // Claude's Google Drive MCP connector exposes the token via window.GAPI_TOKEN or similar
  // We use the fetch-based Drive REST API with the user's session
  return null; // placeholder — actual auth handled via Claude connector proxy
}

function driveSave(){
  if(!window.BT_DRIVE_TOKEN){ toast('No Drive token - enter it in Settings'); return; }
  driveStatus = 'saving';
  renderSettingsDriveStatus();
  var payload = JSON.stringify({clients:clients, opts:OPTS, savedAt:new Date().toISOString(), version:'bt_v4'}, null, 2);

  fetch('https://www.googleapis.com/drive/v3/files?q=name%3D%27billing-tracker-data.json%27+and+trashed%3Dfalse&fields=files(id,name)', {
    headers: {'Authorization':'Bearer '+window.BT_DRIVE_TOKEN}
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    var fileId = data.files && data.files[0] ? data.files[0].id : null;
    if(fileId){
      return fetch('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media', {
        method:'PATCH',
        headers:{'Authorization':'Bearer '+window.BT_DRIVE_TOKEN, 'Content-Type':'application/json'},
        body:payload
      });
    } else {
      var boundary='bt_boundary_xyz';
      var meta=JSON.stringify({name:'billing-tracker-data.json',mimeType:'application/json'});
      var body='--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+payload+'\r\n--'+boundary+'--';
      return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method:'POST',
        headers:{'Authorization':'Bearer '+window.BT_DRIVE_TOKEN, 'Content-Type':'multipart/related; boundary='+boundary},
        body:body
      });
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(data.id||data.kind){ driveStatus='saved:'+new Date().toLocaleTimeString(); toast('Saved to Google Drive'); }
    else { driveStatus='error:Save failed - token may have expired'; toast('Drive save failed'); }
    renderSettingsDriveStatus();
  })
  .catch(function(e){ driveStatus='error:'+e.message; toast('Drive error: '+e.message); renderSettingsDriveStatus(); });
}

function driveLoad(){
  if(!window.BT_DRIVE_TOKEN){
    toast('No Drive token - enter it below');
    return;
  }
  driveStatus = 'loading';
  renderSettingsDriveStatus();
  fetch('https://www.googleapis.com/drive/v3/files?q=name%3D%27'+encodeURIComponent(DRIVE_FILENAME)+'%27+and+trashed%3Dfalse&fields=files(id,name,modifiedTime)', {
    headers: { 'Authorization': 'Bearer '+window.BT_DRIVE_TOKEN }
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data.files || !data.files[0]){
      driveStatus = 'error:No backup file found on Drive';
      toast('No backup found on Drive');
      renderSettingsDriveStatus();
      return Promise.reject('no file');
    }
    var fileId = data.files[0].id;
    driveStatus = 'loading:Found file, downloading...';
    renderSettingsDriveStatus();
    return fetch('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media', {
      headers: { 'Authorization': 'Bearer '+window.BT_DRIVE_TOKEN }
    });
  })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data.clients){
      driveStatus = 'error:Invalid backup file format';
      toast('Invalid backup format');
      renderSettingsDriveStatus();
      return;
    }
    clients = data.clients;
    if(data.opts) OPTS = data.opts;
    // migrate
    clients.forEach(function(c){
      if(!c.payType) c.payType='Bank Transfer';
      if(!c.invType) c.invType='Manual';
      if(!c.frequency) c.frequency='Monthly';
      if(c.anchorMonth===undefined) c.anchorMonth=0;
      if(!c.invoiceDay) c.invoiceDay=c.date;
      if(c.active===undefined) c.active=true;
    });
    nextId = clients.length ? Math.max.apply(null,clients.map(function(c){return c.id;}))+1 : 1;
    save(); saveOpts();
    driveStatus = 'loaded:'+new Date(data.savedAt).toLocaleString();
    toast('Loaded from Google Drive - '+clients.length+' clients');
    VIEW='dashboard';
    render();
  })
  .catch(function(e){
    if(e!=='no file'){
      driveStatus = 'error:'+e.message;
      toast('Drive error: '+e.message);
      renderSettingsDriveStatus();
    }
  });
}

    statusHtml='<div style="color:var(--rd);font-size:12px;margin-top:6px">&#10005; '+driveStatus.slice(6)+'</div>';
  } else if(driveStatus==='token-set'){
    statusHtml='<div style="color:var(--gn);font-size:12px;margin-top:6px">&#10003; Token saved - ready to sync</div>';
  }

  var hasToken=!!(window.BT_DRIVE_TOKEN||savedToken);
  return '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    +'<button class="btn grn sm" onclick="driveSave()" '+(hasToken?'':'disabled title="Enter token first"')+'>&#8593; Save to Drive</button>'
    +'<button class="btn sm" onclick="driveLoad()" '+(hasToken?'':'disabled title="Enter token first"')+'>&#8595; Load from Drive</button>'
    +'</div>'
    +statusHtml
    +'<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)">'
    +'<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px">Google OAuth Token</div>'
    +'<div style="font-size:12px;color:var(--t2);margin-bottom:8px">Paste your Google OAuth access token below. '
    +'Get one by visiting <a href="https://developers.google.com/oauthplayground" target="_blank" style="color:var(--bl)">OAuth Playground</a>, '
    +'authorising <em>drive.file</em> scope, and copying the Access Token. Tokens expire after 1 hour.</div>'
    +'<div style="display:flex;gap:8px">'
    +'<input type="password" id="drive-token-input" placeholder="ya29.a0..." style="flex:1;padding:8px 10px;border:1px solid var(--bd2);border-radius:var(--r);font-size:13px;font-family:Outfit,sans-serif;background:var(--bg);color:var(--tx)">'
    +'<button class="btn sm pri" onclick="setDriveToken()">Save token</button>'
    +'</div>'
    +(hasToken?'<div style="font-size:11px;color:var(--gn);margin-top:5px">&#10003; Token loaded</div>':'')
    +'</div>';
}

// Render immediately from cache, then refresh from Supabase
render();

// Poll Supabase every 30 seconds for changes made on other devices
// Only fetches if no local save is in flight, and only re-renders if data actually changed
setInterval(function(){
  if(SAVE_PENDING || SAVE_TIMER) return; // local edit in progress, skip
  sbGet('clients', function(err, val){
    if(err || !val || !Array.isArray(val) || !val.length) return;
    // Quick change detection: compare updated_at timestamps or JSON length
    var incoming = JSON.stringify(val);
    var current  = JSON.stringify(clients);
    if(incoming === current) return; // nothing changed, skip render
    clients = migrateClients(val);
    nextId = clients.length ? Math.max.apply(null,clients.map(function(c){return c.id;}))+1 : 1;
    try{ localStorage.setItem('bt_v4',JSON.stringify(clients)); }catch(e){}
    updateSyncBadge('ok');
    render();
  });
}, 30000); // every 30 seconds
